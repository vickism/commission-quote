name: Bug report
description: Report a reproducible problem.
title: '[Bug]: '
body:
  - type: markdown
    attributes:
      value: Do not include secrets or personal financial data. Use synthetic examples.
  - type: textarea
    id: summary
    attributes:
      label: Summary
      description: Describe the problem.
    validations:
      required: true
  - type: textarea
    id: steps
    attributes:
      label: Steps to reproduce
      description: Provide numbered steps and synthetic example inputs.
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: Expected behaviour
    validations:
      required: true
  - type: textarea
    id: actual
    attributes:
      label: Actual behaviour
    validations:
      required: true
  - type: input
    id: environment
    attributes:
      label: Environment
      description: Include browser, operating system, Node version and commit where relevant.
  - type: textarea
    id: evidence
    attributes:
      label: Evidence
      description: Include relevant logs or screenshots with secrets and personal financial data removed.
